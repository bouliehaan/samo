name: Feature request
description: Request a feature to be added to samo
title: '[Feature]: '
labels: ['enhancement']
body:
    - type: checkboxes
      id: check-duplicate
      attributes:
          label: I have already checked through the existing feature requests and found no duplicates
          options:
              - label: 'Yes'
                required: true

    - type: textarea
      id: solution
      attributes:
          label: What do you want to be added?
          placeholder: I would like to see [...]
      validations:
          required: true
