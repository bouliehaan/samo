appId: org.bouliehaan.samo
productName: Samo
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
electronVersion: 39.8.6
directories:
    buildResources: assets
files:
    - 'out/**/*'
    # Renderer and remote sourcemaps are ~43 MB and were shipping inside the
    # asar, where the only thing that could read them is devtools opened against
    # a production build. They are still generated into out/ for local
    # debugging — this drops them from the package, not from the build.
    #
    # main/preload maps are deliberately NOT excluded: src/main/index.ts installs
    # `source-map-support` under NODE_ENV=production, so those maps are what turn
    # a user's crash log into a readable stack trace.
    - '!out/renderer/**/*.map'
    - '!out/remote/**/*.map'
    - 'package.json'
extraResources:
    - from: assets
      to: assets
    - from: src/renderer/assets/icons
      to: assets/icons
      filter:
          - icon.png
          - icon.ico
asarUnpack:
    - resources/**
win:
    target:
        - target: zip
          arch:
              - x64
              - arm64
        - target: nsis
          arch:
              - x64
              - arm64
    icon: src/renderer/assets/icons/icon.ico

nsis:
    allowToChangeInstallationDirectory: true
    oneClick: false
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always

mac:
    extraResources:
        # `${arch}` expands to the arch being packaged, so each build carries
        # ONLY its own mpv. This used to be `from: resources/bin/darwin` with
        # `filter: ['**/*']`, which shipped both trees into both builds — every
        # Apple Silicon DMG dragged along a 112 MB Intel mpv it can never
        # execute, and every Intel DMG an 88 MB arm64 one.
        - from: resources/bin/darwin/${arch}
          to: bin
          filter:
              - '**/*'
    target:
        - target: dmg
          arch:
              - arm64
              - x64
        - target: zip
          arch:
              - arm64
              - x64
    icon: build/icon.icns
    type: distribution
    hardenedRuntime: false
    identity: '-'
    gatekeeperAssess: false
    notarize: false
    extendInfo:
        NSAudioCaptureUsageDescription: 'System audio access is required for mpv visualizer capture in Samo'
        NSLocalNetworkUsageDescription: 'Local network is necessary for accessing servers hosted on the same system as Samo'

dmg:
    contents: [{ x: 130, y: 220 }, { x: 410, y: 220, type: link, path: /Applications }]

linux:
    target:
        - AppImage
        - deb
        - tar.xz
    category: AudioVideo;Audio;Player
    icon: src/renderer/assets/icons/icon.png
    artifactName: ${productName}-${os}-${arch}.${ext}

toolsets:
    appimage: '1.0.2'

npmRebuild: false
afterAllArtifactBuild: scripts/after-all-artifact-build.mjs
publish:
    provider: github
    owner: bouliehaan
    repo: samo
    channel: latest
    releaseType: draft
