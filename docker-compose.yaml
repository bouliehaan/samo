services:
    samo:
        container_name: samo
        image: "ghcr.io/bouliehaan/samo:latest"
        restart: unless-stopped
        environment:
            - SERVER_NAME=samo # pre-defined server name
            - SERVER_LOCK=false # When true AND name/type/url are set, only username/password can be toggled
            - SERVER_TYPE=samo # the only supported type
            - SERVER_URL=http://localhost:6969 # http://address:port or https://address:port
            # - REMOTE_URL=http://share.localhost # Base URL used when building custom sharing links
            - LEGACY_AUTHENTICATION=false # When SERVER_LOCK is true, sets the legacyauth flag for server authentication (true or false)
        ports:
            - 9180:9180
            # Alternatively, to restrict to only localhost, - 127.0.0.1:9180:8190
