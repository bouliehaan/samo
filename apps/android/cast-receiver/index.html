<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>samo</title>
  <link rel="stylesheet" href="https://www.gstatic.com/cast/sdk/libs/caf_receiver/css/player.css" />
  <style>
    body {
      background: #000;
      margin: 0;
      overflow: hidden;
    }
    cast-media-player {
      --playback-logo-image: none;
      --theme-hue: 0;
    }
  </style>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    const setIdleLabel = () => {
      context.setApplicationState('samo');
    };

    context.addEventListener(
      cast.framework.system.EventType.READY,
      setIdleLabel,
    );
    playerManager.addEventListener(
      cast.framework.events.EventType.MEDIA_FINISHED,
      setIdleLabel,
    );
    playerManager.addEventListener(
      cast.framework.events.EventType.IDLE,
      setIdleLabel,
    );
    playerManager.addEventListener(
      cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
      () => {
        context.setApplicationState('');
      },
    );

    context.start();
    setIdleLabel();
  </script>
</body>
</html>
